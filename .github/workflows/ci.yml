name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu2204, ubuntu2404, ubuntu2604, debian12, debian13]
        php: ['8.2', '8.3', '8.4', '8.5']
    name: ${{ matrix.distro }} / php ${{ matrix.php }}
    env:
      PLAYBOOK: /etc/ansible/roles/role-php/tests/test.yml
      ANSIBLE_FORCE_COLOR: '1'
    steps:
      - uses: actions/checkout@v4

      # systemd-enabled image with ansible preinstalled, so services can start like on a real box
      - name: Start test container
        run: >
          docker run -d --name test --privileged --cgroupns=host
          -v /sys/fs/cgroup:/sys/fs/cgroup:rw
          -v "$PWD":/etc/ansible/roles/role-php:ro
          geerlingguy/docker-${{ matrix.distro }}-ansible:latest

      - name: Check the role/playbook's syntax
        run: docker exec test ansible-playbook $PLAYBOOK --syntax-check

      - name: Run the role/playbook
        run: docker exec test ansible-playbook $PLAYBOOK -e php_version=${{ matrix.php }}

      - name: Run the role/playbook again, checking to make sure it's idempotent
        run: >
          docker exec test ansible-playbook $PLAYBOOK -e php_version=${{ matrix.php }}
          | tee /dev/stderr | grep -q 'changed=0.*failed=0'

      - name: Check the requested PHP version is installed and working
        run: >
          docker exec test php -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;'
          | grep -qx '${{ matrix.php }}'

      - name: Check php-fpm is running
        run: docker exec test systemctl is-active php${{ matrix.php }}-fpm
