---
- name: Install repository prerequisites
  become: yes
  apt:
    pkg: ca-certificates
    update_cache: yes
    cache_valid_time: 3600

- name: Ensure apt keyrings directory exists
  become: yes
  file: path=/etc/apt/keyrings state=directory mode=0755

# fetched once to a file: keyserver output is not byte-stable, so a signed_by URL is never idempotent
- name: Add PHP repository key
  become: yes
  get_url:
    url: "{{ php_repository[ansible_facts.distribution].key }}"
    dest: "{{ php_repository[ansible_facts.distribution].key_file }}"
    mode: '0644'
    force: no

- name: Add PHP repository
  become: yes
  deb822_repository:
    name: php
    uris: "{{ php_repository[ansible_facts.distribution].uri }}"
    suites: "{{ ansible_facts.distribution_release }}"
    components: main
    signed_by: "{{ php_repository[ansible_facts.distribution].key_file }}"
    install_python_debian: yes
  register: php_repo

- name: Update packages database for the PHP repository
  become: yes
  apt: update_cache=yes
  when: php_repo is changed

- name: Install php
  become: yes
  apt:
    pkg: ["php{{ php_version }}", "php{{ php_version }}-fpm"]
    state: latest

- name: Install PHP Packages
  become: yes
  apt:
    pkg: "{{ php.packages | map('regex_replace', '^', 'php' ~ php_version ~ '-') | list }}"
    state: latest
  when: php.packages is defined

- import_tasks: configure.yml

- import_tasks: pecl.yml
